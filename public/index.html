<!DOCTYPE html>
<html>
  <head>
    <title>Live Bluetooth Data</title>
    <script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
  </head>
  <body>
    <h2>📶 Live Data from HC-05</h2>
    <div id="log" style="white-space: pre-wrap"></div>

    <script>
      const socket = io("http://smartv2server-production.up.railway.app:8080");
      const log = document.getElementById("log");

      socket.on("newData", (data) => {
        log.textContent += `→ ${data}\n`;
      });
    </script>
  </body>
</html>
