<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Health Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="online" style="background-color: forestgreen"></div>
    <div class="container">
      <div class="chart"></div>
      <div id="map"></div>
    </div>
    <div class="log-container">
      <h3>📋 Events</h3>
      <div id="log" class="log-box"></div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
      const online_div = document.querySelector(".online");
      const chart_div = document.querySelector(".chart");

      var map = L.map("map").setView([51.505, -0.09], 13); // Coordinates for London, zoom level 13

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      class KalmanFilter {
        constructor({ R = 0.01, Q = 1 } = {}) {
          this.R = R; // noise
          this.Q = Q; // process variance
          this.A = 1;
          this.B = 0;
          this.C = 1;
          this.cov = NaN;
          this.x = NaN;
        }

        filter(z) {
          if (isNaN(this.x)) {
            this.x = (1 / this.C) * z;
            this.cov = (1 / this.C) * this.R * (1 / this.C);
          } else {
            // Prediction
            const predX = this.A * this.x;
            const predCov = this.A * this.cov * this.A + this.Q;

            // Kalman Gain
            const K = (predCov * this.C) / (this.C * predCov * this.C + this.R);

            // Correction
            this.x = predX + K * (z - this.C * predX);
            this.cov = predCov - K * this.C * predCov;
          }

          return this.x;
        }

        lastEstimate() {
          return this.x;
        }
      }

      function logEvent(userid, message, type = "info") {
        const logBox = document.getElementById("log");
        const timestamp = new Date().toLocaleTimeString();

        const entry = document.createElement("div");
        entry.classList.add("log-entry", `log-${type}`);

        entry.innerHTML = `<strong>[${timestamp}] [${userid}]</strong> ${message}`;

        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
      }

      const MAX_POINTS = 20;

      class User {
        constructor(userid) {
          this.userid = userid;
          this.isOnline = true;
          this.lastTime = Date.now();
          this.marker = L.marker([0, 0])
            .addTo(map)
            .bindPopup(this.userid)
            .openPopup();
          this.hr_ctx = document.getElementById(`${this.userid}_hr`);
          this.temp_ctx = document.getElementById(`${this.userid}_temp`);
          this.hr_cfg = {
            type: "line",
            data: {
              labels: [],
              datasets: [
                {
                  label: "Heart Rate",
                  data: [],
                  borderWidth: 1,
                  borderColor: "red",
                },
                {
                  label: "SpO2",
                  data: [],
                  borderWidth: 1,
                  borderColor: "green",
                },
                {
                  label: "Heart Rate Filtered",
                  data: [],
                  borderWidth: 1,
                  borderColor: "yellow",
                },
              ],
            },
            options: {
              scales: {
                y: {
                  beginAtZero: true,
                },
              },
            },
          };
          this.temp_cfg = {
            type: "line",
            data: {
              labels: [],
              datasets: [
                {
                  label: "temp",
                  data: [],
                  borderWidth: 1,
                  borderColor: "blue",
                },
              ],
            },
            options: {
              scales: {
                y: {
                  beginAtZero: true,
                },
              },
            },
          };
          this.hr_chart = new Chart(this.hr_ctx, this.hr_cfg);
          this.temp_chart = new Chart(this.temp_ctx, this.temp_cfg);
          this.kf_hr = new KalmanFilter({ R: 20, Q: 1 });
          this.kf_spo2 = new KalmanFilter({ R: 0.1, Q: 1 });
        }
        addData(msg) {
          this.lastTime = Date.now();
          const now = new Date();
          const time = now.toLocaleTimeString();
          if (msg.data.type === "POX") {
            if (this.hr_cfg.data.labels.length > MAX_POINTS) {
              this.hr_cfg.data.labels.shift();
              this.hr_cfg.data.datasets[0].data.shift();
              this.hr_cfg.data.datasets[1].data.shift();
              this.hr_cfg.data.datasets[2].data.shift();
            }
            const hr_filtered = this.kf_hr.filter(msg.data.hr);
            const spo2_filtered = this.kf_spo2.filter(msg.data.spo2);
            this.hr_cfg.data.labels.push(time);
            this.hr_cfg.data.datasets[0].data.push(msg.data.hr);
            this.hr_cfg.data.datasets[1].data.push(msg.data.spo2);
            this.hr_cfg.data.datasets[2].data.push(hr_filtered);
          }
          if (msg.data.type === "ENV") {
            if (this.temp_cfg.data.labels.length > MAX_POINTS) {
              this.temp_cfg.data.labels.shift();
              this.temp_cfg.data.datasets[0].data.shift();
            }
            this.temp_cfg.data.labels.push(time);
            this.temp_cfg.data.datasets[0].data.push(msg.data.temp);

            this.marker.setLatLng([msg.data.lat, msg.data.long]);
            this.marker.bindPopup(
              `User: ${this.userid}<br>Temp: ${msg.data.temp}<br>RH: ${msg.data.rh}% <br>Altitude: ${msg.data.alt} m`
            );
          }

          if (msg.data.type === "ACC") {
            if (msg.data.ev == "FREEFALL") {
              logEvent(this.userid, "FreeFall detected!!!", "error");
            } else {
              logEvent(this.userid, msg.data.ev, "warning");
            }
          }

          this.hr_chart.update();
          this.temp_chart.update();
        }
      }

      let users = {};

      // ✅ Connect to WebSocket server
      const socket = new WebSocket("ws://" + "185.204.197.169" + ":8080");

      socket.onopen = () => {
        console.log("WebSocket connected");
        online_div.style.backgroundColor = "forestgreen";
        online_div.innerHTML = "<strong>ONLINE</strong>";
      };

      socket.onclose = () => {
        console.warn("WebSocket disconnected");
        online_div.style.backgroundColor = "red";
        online_div.innerHTML = "<strong>OFFLINE</strong>";
      };

      socket.onerror = (err) => {
        console.error("WebSocket error", err);
      };

      // ✅ When receiving message from server
      socket.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          let userid = msg.userid;
          console.log(`msg from username: ${msg.userid}`);

          if (!users[msg.userid]) {
            chart_div.insertAdjacentHTML(
              "beforeend",
              `<div class="user-card">
                <h3>User: ${userid}</h3>
                <canvas id="${userid}_hr"></canvas>
                <canvas id="${userid}_temp"></canvas>
              </div>‍‍‍`
            );
            users[msg.userid] = new User(msg.userid);
            logEvent(userid, "Connected!", "success");
          }
          users[msg.userid].addData(msg);
        } catch (e) {
          console.error("Invalid Json message", e);
        }
      };

      setInterval(() => {
        for (let id in users) {
          if (Date.now() - users[id].lastTime > 240000) {
            logEvent(id, "is Disconnected!", "error");
          }
        }
      }, 120000);
    </script>
  </body>
</html>
