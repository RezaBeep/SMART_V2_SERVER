<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Health Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      #map {
        height: 300px;
        width: 150;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="chart">
        <div>
          <canvas id="HRChart"></canvas>
        </div>
        <div>
          <canvas id="tempChart"></canvas>
        </div>
      </div>
      <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
      var map = L.map("map").setView([51.505, -0.09], 13); // Coordinates for London, zoom level 13

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      // Add a marker
      const marker = L.marker([51.5, -0.1])
        .addTo(map)
        .bindPopup("A sample marker.")
        .openPopup();

      const hr_ctx = document.getElementById("HRChart");
      const temp_ctx = document.getElementById("tempChart");
      let hr_cfg = {
        type: "line",
        data: {
          labels: [],
          datasets: [
            {
              label: "Heart Rate",
              data: [],
              borderWidth: 1,
              borderColor: "red",
            },
            {
              label: "SpO2",
              data: [],
              borderWidth: 1,
              borderColor: "green",
            },
          ],
        },
        options: {
          scales: {
            y: {
              beginAtZero: true,
            },
          },
        },
      };

      let temp_cfg = {
        type: "line",
        data: {
          labels: [],
          datasets: [
            {
              label: "temp",
              data: [],
              borderWidth: 1,
              borderColor: "blue",
            },
          ],
        },
        options: {
          scales: {
            y: {
              beginAtZero: true,
            },
          },
        },
      };

      let hr_chart = new Chart(hr_ctx, hr_cfg);
      let temp_chart = new Chart(temp_ctx, temp_cfg);
      const MAX_POINTS = 20;

      setInterval(async () => {
        const url = "http://91.207.18.155:3000/api/data";
        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
          }
          const json = await response.json();
          console.log(json);
          const now = new Date();
          const time = now.toLocaleTimeString();

          if (hr_cfg.data.labels.length > MAX_POINTS) {
            hr_cfg.data.labels.shift();
            hr_cfg.data.datasets[0].data.shift();
            hr_cfg.data.datasets[1].data.shift();
            temp_cfg.data.labels.shift();
            temp_cfg.data.datasets[0].data.shift();
          }

          hr_cfg.data.labels.push(time);
          hr_cfg.data.datasets[0].data.push(json["hr"]);
          hr_cfg.data.datasets[1].data.push(json["spo2"]);
          temp_cfg.data.labels.push(time);
          temp_cfg.data.datasets[0].data.push(json["temp"]);
          hr_chart.update();
          temp_chart.update();
          marker.setLatLng([json["lat"], json["long"]]);
        } catch (error) {
          console.error(error.message);
        }
      }, 2000);
    </script>
  </body>
</html>
