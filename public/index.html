<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Data</title>

    <script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
    <style>
      #log {
        white-space: pre-wrap;
        height: 300px;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #ccc;
        font-family: monospace;
        background: #f9f9f9;
      }
      .temp {
        color: #007bff;
      } /* blue */
      .heart {
        color: #28a745;
      } /* green */
      .spo2-normal {
        color: #6c757d;
      } /* gray */
      .spo2-low {
        color: red;
        font-weight: bold;
      }
      .location {
        color: #dc3545;
      } /* red */
    </style>
  </head>
  <body>
    <h2>📶 Live Data</h2>
    <h3>By Reza Behroozian</h3>
    <div id="log"></div>

    <script>
      const socket = io("https://smartv2server-production.up.railway.app");
      const log = document.getElementById("log");

      function getTime() {
        const now = new Date();
        return now.toLocaleTimeString(); // e.g., "14:05:33"
      }

      socket.on("newData", (data) => {
        const line = data.trim();
        const time = getTime();
        let formatted = "";

        // If data is from Bluetooth (e.g., Temp or Heart rate)
        if (line.startsWith("Temp")) {
          formatted = `<div class="temp">[${time}] 🌡️ ${line}</div>`;
        } else if (line.startsWith("Heart rate")) {
          const hrMatch = line.match(
            /Heart rate:(\d+(\.\d+)?)bpm \/ SpO2:(\d+)%/
          );
          if (hrMatch) {
            const bpm = hrMatch[1];
            const spo2 = parseInt(hrMatch[3]);
            const spo2Class = spo2 < 95 ? "spo2-low" : "spo2-normal";
            formatted = `
          <div>
            [${time}]
            <span class="heart">❤️ Heart Rate: ${bpm} bpm</span> /
            <span class="${spo2Class}">🫁 SpO₂: ${spo2}%</span>
          </div>
        `;
          } else {
            formatted = `<div>[${time}] ${line}</div>`;
          }
        } else if (line.startsWith("Location")) {
          // GPS data (latitude and longitude)
          const locationMatch = line.match(
            /Location - Latitude: (-?\d+\.\d+), Longitude: (-?\d+\.\d+)/
          );
          if (locationMatch) {
            const lat = locationMatch[1];
            const lng = locationMatch[2];
            formatted = `
              <div class="location">
                [${time}] 🌍 Location: Latitude: ${lat}, Longitude: ${lng}
              </div>
            `;
          }
        } else {
          formatted = `<div>[${time}] ${line}</div>`;
        }

        if (log) {
          log.innerHTML += formatted;
          log.scrollTop = log.scrollHeight;
        }
      });
    </script>
  </body>
</html>
